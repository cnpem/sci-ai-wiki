[project]
name = "wiki-agent-ui"
version = "0.1.0"
description = "Local read-only chat for research wikis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.116.1",
    "pypdf==5.9.0",
    "python-dotenv==1.1.1",
    "python-multipart==0.0.20",
    "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.1",
]

[tool.uv]
package = false

[tool.poetry]
package-mode = false
requires-poetry = ">=2.0"
